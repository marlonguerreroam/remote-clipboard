# Temporary: deletes every stored workflow artifact (old CI builds of the installer). Removed right after it runs.
name: Purge artifacts
on:
  push:
    branches: [claude/lucid-hopper-o3y4pk]
    paths: ['.github/workflows/purge-artifacts.yml']
permissions:
  actions: write
jobs:
  purge:
    runs-on: ubuntu-latest
    steps:
      - name: Delete all artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" --jq '.artifacts[].id' > ids.txt
          echo "Artifacts found: $(wc -l < ids.txt)"
          while read -r id; do gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$id"; done < ids.txt
          echo "Remaining: $(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts" --jq '.total_count')"
