name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    name: Build & test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Build
        run: dotnet build -c Release
      - name: Test
        run: dotnet test -c Release --no-build

  publish:
    name: Portable build (win-x64)
    needs: build-test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Publish self-contained
        run: dotnet publish src/RemoteClipboard.App -c Release -r win-x64 --self-contained -p:PublishReadyToRun=true -o publish/RemoteClipboard
      - uses: actions/upload-artifact@v7
        with:
          name: RemoteClipboard-win-x64
          path: publish/RemoteClipboard
          retention-days: 14
      - name: Build installer
        run: .github/scripts/build-installer.ps1 -Version 0.0.0 -SourceDir publish/RemoteClipboard
      - uses: actions/upload-artifact@v7
        with:
          name: RemoteClipboardSetup
          path: installer/Output/*.exe
          retention-days: 14
