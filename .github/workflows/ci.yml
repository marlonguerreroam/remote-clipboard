name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    name: Build & test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Build
        run: dotnet build -c Release
      - name: Test
        run: dotnet test -c Release --no-build

  # Validates that the app publishes and the installer builds. The binaries are NOT uploaded as
  # artifacts: in a public repository anyone could download them, and the installer is sold separately.
  # Pushes to work branches (never main, never forks) leave a test build in a private draft release.
  publish:
    name: Portable build (win-x64)
    needs: build-test
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Publish self-contained
        run: dotnet publish src/RemoteClipboard.App -c Release -r win-x64 --self-contained -p:PublishReadyToRun=true -o publish/RemoteClipboard
      - name: Build installer
        run: .github/scripts/build-installer.ps1 -Version 0.0.0 -SourceDir publish/RemoteClipboard
      - name: Test build in a private draft release
        if: github.event_name == 'push' && github.ref_name != 'main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = 'prueba-' + ($env:GITHUB_REF_NAME -replace '[^A-Za-z0-9._-]', '-')
          gh release delete $tag --yes 2>$null # previous test build of this branch, if any
          $global:LASTEXITCODE = 0
          Compress-Archive -Path publish/RemoteClipboard/* -DestinationPath "RemoteClipboard-$tag-win-x64.zip"
          $installer = (Get-ChildItem installer/Output/*.exe).FullName
          gh release create $tag "RemoteClipboard-$tag-win-x64.zip" $installer --draft --target $env:GITHUB_SHA --title "Prueba $env:GITHUB_REF_NAME ($($env:GITHUB_SHA.Substring(0, 7)))" --notes 'Build de prueba privado (borrador). No publicar.'
