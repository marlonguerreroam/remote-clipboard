name: Release

# Builds and tests a version, then:
#   - publishes the public release vX.Y.Z (tag + notes + source code, NO binaries: the ready-made
#     installer is sold separately; anyone may still build it from source, as the GPL-3.0 allows);
#   - attaches the installer, the portable ZIP and the MSIX packages (Store upload + self-signed test
#     package with its .cer) to a DRAFT release "vX.Y.Z-binarios", visible only to
#     people with write access. Download them from there for the sales channel; never publish that draft.
# Triggered by pushing a tag such as v0.1.0, or manually (Actions → Release → Run workflow) with a
# version: the release then creates the tag on the commit being built.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag to create, e.g. v0.1.0'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
      # Code signing runs only when the certificate secrets exist (see .github/scripts/sign.ps1).
      # The secrets themselves are exposed only to the signing steps.
      HAS_CODESIGN: ${{ secrets.CODESIGN_PFX_BASE64 != '' }}
    steps:
      - name: Validate version
        run: if ($env:TAG -notmatch '^v\d+\.\d+\.\d+$') { throw "Version must look like v1.2.3, got '$env:TAG'" }
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Test
        run: dotnet test -c Release
      - name: Publish self-contained (win-x64)
        run: dotnet publish src/RemoteClipboard.App -c Release -r win-x64 --self-contained -p:PublishReadyToRun=true -p:Version=$($env:TAG.TrimStart('v')) -o publish/RemoteClipboard
      - name: Sign application
        if: env.HAS_CODESIGN == 'true'
        run: .github/scripts/sign.ps1 -Files publish/RemoteClipboard/RemoteClipboard.exe
        env:
          CODESIGN_PFX_BASE64: ${{ secrets.CODESIGN_PFX_BASE64 }}
          CODESIGN_PFX_PASSWORD: ${{ secrets.CODESIGN_PFX_PASSWORD }}
      - name: Package portable ZIP
        run: Compress-Archive -Path publish/RemoteClipboard/* -DestinationPath "RemoteClipboard-$env:TAG-win-x64.zip"
      - name: Build installer
        run: .github/scripts/build-installer.ps1 -Version ($env:TAG.TrimStart('v')) -SourceDir publish/RemoteClipboard
      - name: Sign installer
        if: env.HAS_CODESIGN == 'true'
        run: .github/scripts/sign.ps1 -Files "installer/Output/RemoteClipboardSetup-$env:TAG.exe"
        env:
          CODESIGN_PFX_BASE64: ${{ secrets.CODESIGN_PFX_BASE64 }}
          CODESIGN_PFX_PASSWORD: ${{ secrets.CODESIGN_PFX_PASSWORD }}
      - name: Build MSIX for the Microsoft Store
        # Identity from Partner Center → the app → Product identity, stored as repository variables
        # (Settings → Secrets and variables → Actions → Variables). Unsigned: the Store signs it.
        if: vars.MSIX_IDENTITY_NAME != ''
        env:
          MSIX_IDENTITY_NAME: ${{ vars.MSIX_IDENTITY_NAME }}
          MSIX_PUBLISHER: ${{ vars.MSIX_PUBLISHER }}
          MSIX_PUBLISHER_DISPLAY_NAME: ${{ vars.MSIX_PUBLISHER_DISPLAY_NAME }}
          MSIX_DISPLAY_NAME: ${{ vars.MSIX_DISPLAY_NAME }}
        run: .github/scripts/build-msix.ps1 -Version ($env:TAG.TrimStart('v')) -SourceDir publish/RemoteClipboard -OutputPath "msix/RemoteClipboard-$env:TAG-store.msix" -IdentityName $env:MSIX_IDENTITY_NAME -Publisher $env:MSIX_PUBLISHER -PublisherDisplayName $env:MSIX_PUBLISHER_DISPLAY_NAME -DisplayName $env:MSIX_DISPLAY_NAME
      - name: Build MSIX for testing (self-signed, sideload)
        run: .github/scripts/build-msix.ps1 -Version ($env:TAG.TrimStart('v')) -SourceDir publish/RemoteClipboard -OutputPath "msix/RemoteClipboard-$env:TAG-test.msix" -TestSign
      - name: Publish license tool (author only)
        run: dotnet publish tools/RemoteClipboard.LicenseTool -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -p:DebugType=none -o msix
      - name: Upload binaries to a private draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $files = @("installer/Output/RemoteClipboardSetup-$env:TAG.exe", "RemoteClipboard-$env:TAG-win-x64.zip") + (Get-ChildItem msix/*).FullName
          gh release create "$env:TAG-binarios" @files --draft --target "${{ github.sha }}" --title "Binarios $env:TAG (privado: no publicar)" --notes "Instalador y ZIP portable para el canal de venta. Borrador privado: no lo publiques."
      - name: Create public release (source only)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$env:TAG" --target "${{ github.sha }}" --title "Remote Clipboard $env:TAG" --generate-notes
