name: Release

# Publishing a tag such as v0.1.0 builds, tests and attaches the portable build to a GitHub Release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Test
        run: dotnet test -c Release
      - name: Publish self-contained (win-x64)
        run: dotnet publish src/RemoteClipboard.App -c Release -r win-x64 --self-contained -p:PublishReadyToRun=true -p:Version=$("${{ github.ref_name }}".TrimStart('v')) -o publish/RemoteClipboard
      - name: Package
        run: Compress-Archive -Path publish/RemoteClipboard/* -DestinationPath "RemoteClipboard-${{ github.ref_name }}-win-x64.zip"
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" "RemoteClipboard-${{ github.ref_name }}-win-x64.zip" --title "Remote Clipboard ${{ github.ref_name }}" --generate-notes
